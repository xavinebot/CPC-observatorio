name: "Tests"

# Comprueba que las reglas de validacion, la cuarentena y los analizadores de cada fuente siguen funcionando.
# No toca la red: usa muestras reales guardadas en tests/fixtures.

on:
  push:
    paths:
      - "observatorio/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
